parameters:
  - name: dockerfilePath
    type: string
    default: '$(Build.SourcesDirectory)/Dockerfile'

steps:
  - bash: |
      set -e
      echo "=========================================================="
      echo "     Trivy - Container Image Vulnerability Scanner       "
      echo "=========================================================="
      echo "Building local image for vulnerability scan..."
      docker build -t nextops-dashboard:scan-$(Build.BuildId) -f ${{ parameters.dockerfilePath }} .

      echo "Installing Trivy..."
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      trivy --version

      echo "Scanning container image for HIGH and CRITICAL vulnerabilities..."
      trivy image --exit-code 0 --severity HIGH,CRITICAL nextops-dashboard:scan-$(Build.BuildId)
      echo "Trivy container scan completed."
    displayName: 'Execute Trivy Container Scan'
