steps:
  - bash: |
      set -e
      echo "=========================================================="
      echo "         Gitleaks - Secret & Credential Detection         "
      echo "=========================================================="
      curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
      sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      gitleaks version
      echo "Scanning repository for exposed secrets..."
      gitleaks detect --source . -v
      echo "Gitleaks scan passed. No secrets detected."
    displayName: 'Execute Gitleaks Secret Scanner'
