parameters:
  - name: nodeVersion
    type: string
    default: '20.x'

steps:
  - task: NodeTool@0
    displayName: 'Setup Node.js (${{ parameters.nodeVersion }})'
    inputs:
      versionSpec: '${{ parameters.nodeVersion }}'

  - bash: |
      set -e
      echo "=========================================================="
      echo "           ESLint - Frontend TypeScript/React Linter      "
      echo "=========================================================="
      npm ci
      echo "Running ESLint..."
      npm run lint || true
      echo "ESLint check completed."
    displayName: 'Execute ESLint Code Analysis'
