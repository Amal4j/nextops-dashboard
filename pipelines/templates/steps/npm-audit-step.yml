parameters:
  - name: nodeVersion
    type: string
    default: '20.x'

steps:
  - task: NodeTool@0
    displayName: 'Setup Node.js (${{ parameters.nodeVersion }})'
    inputs:
      versionSpec: '${{ parameters.nodeVersion }}'

  - bash: |
      set -e
      echo "=========================================================="
      echo "      npm audit - Software Composition Analysis (SCA)     "
      echo "=========================================================="
      npm audit --audit-level=high || true
      echo "npm audit SCA scan completed."
    displayName: 'Execute npm audit SCA'
