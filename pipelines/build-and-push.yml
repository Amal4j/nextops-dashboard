# ==============================================================================
# NextOps Industrial - Frontend Dashboard CI/CD Pipeline
# Execution: Manual Trigger Only
# ==============================================================================

trigger: none
pr: none

parameters:
  - name: environment
    displayName: Target Environment
    type: string
    default: dev
    values:
      - dev
      - prod

  - name: run_hadolint
    displayName: "1. Linting - Hadolint (Dockerfile Linter)"
    type: boolean
    default: true

  - name: run_eslint
    displayName: "2. Linting - ESLint (TypeScript/React Linter)"
    type: boolean
    default: true

  - name: run_sonarqube
    displayName: "3. SAST - SonarQube (Enterprise Quality Gate)"
    type: boolean
    default: true

  - name: run_npm_audit
    displayName: "4. SCA - npm audit (Dependency Vulnerability Scanner)"
    type: boolean
    default: true

  - name: run_gitleaks
    displayName: "5. Secrets - Gitleaks (Credential Detection)"
    type: boolean
    default: true

  - name: run_trivy
    displayName: "6. Container Security - Trivy (CVE Audit)"
    type: boolean
    default: true

  - name: run_docker_push
    displayName: "7. Build & Push - Azure Container Registry"
    type: boolean
    default: true

  - name: run_gitops_update
    displayName: "8. GitOps - Update Deployment Manifest"
    type: boolean
    default: false

stages:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - template: templates/stages/docker-stage.yml
      parameters:
        environment: 'dev'
        azureServiceConnection: 'NextOps-Azure-Connection'
        acrName: 'acrnextopsdev'
        acrLoginServer: 'acrnextopsdev.azurecr.io'
        imageRepository: 'nextops-dashboard'
        run_hadolint: ${{ parameters.run_hadolint }}
        run_eslint: ${{ parameters.run_eslint }}
        run_sonarqube: ${{ parameters.run_sonarqube }}
        run_npm_audit: ${{ parameters.run_npm_audit }}
        run_gitleaks: ${{ parameters.run_gitleaks }}
        run_trivy: ${{ parameters.run_trivy }}
        run_docker_push: ${{ parameters.run_docker_push }}
        run_gitops_update: ${{ parameters.run_gitops_update }}

  - ${{ if eq(parameters.environment, 'prod') }}:
    - template: templates/stages/docker-stage.yml
      parameters:
        environment: 'prod'
        azureServiceConnection: 'NextOps-Azure-Connection'
        acrName: 'acrnextopsprod'
        acrLoginServer: 'acrnextopsprod.azurecr.io'
        imageRepository: 'nextops-dashboard'
        run_hadolint: ${{ parameters.run_hadolint }}
        run_eslint: ${{ parameters.run_eslint }}
        run_sonarqube: ${{ parameters.run_sonarqube }}
        run_npm_audit: ${{ parameters.run_npm_audit }}
        run_gitleaks: ${{ parameters.run_gitleaks }}
        run_trivy: ${{ parameters.run_trivy }}
        run_docker_push: ${{ parameters.run_docker_push }}
        run_gitops_update: ${{ parameters.run_gitops_update }}
